name: Java/Angular app
on:
  push:
    branches: [ "main" ]
jobs:
  backend-check-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'semeru'
        cache: maven
frontend-check-code:
  runs-on: ubuntu-latest
  defaults:
    run:
      shell: bash
      working-directory: ./frontend
  steps:
    - name: Check out repository code
      uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        version: '24'
        cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
    - run: npm install
    - run: npm run build --if-present
